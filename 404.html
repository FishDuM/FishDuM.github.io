<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>走错海域了 · 会飞的鱼</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E9D8B7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D2233'/%3E%3Cpath d='M4 17c2.4-4.6 7.2-7.4 11.6-6.2 3 .8 5 2.7 6.4 5-1.4 2.3-3.4 4.2-6.4 5-4.4 1.2-9.2-1.6-11.6-6.2Z' fill='%23FF6B4A'/%3E%3Cpath d='M22.5 12.5 28 9.5v15l-5.5-3Z' fill='%23FF6B4A'/%3E%3Ccircle cx='9.6' cy='15.6' r='1.5' fill='%230D2233'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/style.css">
<script>document.documentElement.classList.add('js');</script>
<style>
  /* 搁浅页：整页换到水面上，沙滩配色直接覆盖令牌 */
  body.beach {
    background: linear-gradient(180deg, #C9E4E4 0%, #EFE3C0 34%, #E9D5A8 100%);
    color: #2B2118;
    min-height: 100vh;
  }

  .beach .nav.is-stuck {
    background: rgba(233, 216, 183, 0.8);
    box-shadow: 0 1px 0 rgba(43, 33, 24, 0.16);
  }

  .beach :focus-visible { outline-color: #B14033; }

  .beach-hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    overflow: hidden;
    padding-block: 6rem 7rem;
  }

  .oops__tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: var(--t--1);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #fff;
    background: var(--coral-deep);
    padding: 0.4em 0.9em;
    border-radius: 8px;
    margin-bottom: clamp(1.4rem, 1rem + 1.6vw, 2.2rem);
  }

  .oops__title { font-size: var(--t-3); margin-bottom: 0.7rem; color: #2B2118; }

  .oops__say {
    font-size: var(--t-1);
    font-weight: 500;
    color: #5C4B36;
    max-width: 24em;
    margin-bottom: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem);
  }

  .oops__go { display: flex; flex-wrap: wrap; gap: 0.8rem; }

  .oops__go a {
    padding: 0.75em 1.5em;
    font-size: var(--t--1);
    font-weight: 700;
    border: 1.5px solid #2B2118;
    border-radius: 10px;
    background: rgba(255, 252, 244, 0.75);
    transition: transform 0.35s var(--pop), background-color 0.3s var(--ease);
  }

  .oops__go a:first-child { background: var(--coral-deep); color: #fff; border-color: var(--coral-deep); }

  @media (hover: hover) {
    .oops__go a:hover { transform: translateY(-3px); background: #FFFCF4; }
    .oops__go a:first-child:hover { background: var(--coral); border-color: var(--coral); }
  }

  .oops__hint {
    margin-top: clamp(2rem, 1.4rem + 2vw, 3rem);
    font-size: var(--t--1);
    font-weight: 500;
    color: #8A7458;
  }

  .oops__hint b { color: var(--coral-deep); font-weight: 700; }

  @media (hover: none) and (pointer: coarse) { .oops__hint { display: none; } }

  /* 搁浅的鱼：躺在沙上的剪影，X 眼 */
  .oops__fish {
    position: absolute;
    right: clamp(-4%, 2vw, 10%);
    bottom: clamp(2rem, 6vw, 5rem);
    width: clamp(180px, 30vw, 380px);
    opacity: 0.92;
    pointer-events: none;
    transform: rotate(-4deg);
  }

  /* 远处那条够不着的水线 */
  .oops__tide {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 44px;
    background:
      radial-gradient(120% 18px at 50% 0, rgba(19, 48, 63, 0.35) 60%, transparent 61%) top / 220px 18px repeat-x,
      linear-gradient(180deg, transparent 10px, #9CC4C4 10px);
  }
</style>
</head>
<body class="beach">

<nav class="nav">
  <a class="nav__mark" href="/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 17c2.4-4.6 7.2-7.4 11.6-6.2 3 .8 5 2.7 6.4 5-1.4 2.3-3.4 4.2-6.4 5-4.4 1.2-9.2-1.6-11.6-6.2Z" fill="currentColor"/><path d="M22.5 12.5 28 9.5v15l-5.5-3Z" fill="currentColor"/></svg>
    <span>会飞的鱼</span>
  </a>
</nav>

<main>
  <header class="beach-hero">
    <div class="wrap">
      <p class="oops__tag">404 · 搁浅</p>

      <h1 class="oops__title">走错海域了</h1>

      <p class="oops__say">
        这片海是干的。地址不存在，可能是我把那一页删了，
        也可能只是手滑多敲了几个字符。
      </p>

      <p class="oops__go">
        <a href="/">游回首页</a>
        <a href="/#works">直接看做过的东西</a>
        <a href="https://github.com/FishDuM" target="_blank" rel="noopener" data-repo="github">去 GitHub</a>
      </p>

      <p class="oops__hint">既然来都来了，这一页也能连续敲 <b>fish</b> 唤声呐。</p>
    </div>

    <svg class="oops__fish" viewBox="0 0 380 190" aria-hidden="true">
      <ellipse cx="200" cy="176" rx="150" ry="9" fill="rgba(43,33,24,0.14)"/>
      <path d="M52 108 C86 56 168 40 232 62 C266 74 292 92 306 112 C292 132 266 150 232 162 C168 184 86 168 52 108 Z" fill="#FF7A50"/>
      <path d="M296 84 L356 52 C350 92 350 132 356 172 L296 140 C310 122 310 102 296 84 Z" fill="#E04E2F"/>
      <path d="M150 56 C166 34 196 30 214 44 L196 68 Z" fill="#E04E2F"/>
      <path d="M160 96 C186 88 214 92 234 108 C214 122 186 126 160 118 C150 112 150 102 160 96 Z" fill="#FFC9A8" opacity="0.85"/>
      <g stroke="#2B2118" stroke-width="5" stroke-linecap="round">
        <path d="M96 84 l14 14 M110 84 l-14 14"/>
      </g>
      <path d="M64 100 C76 96 84 98 90 106" stroke="#2B2118" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>

    <div class="oops__tide" aria-hidden="true"></div>
  </header>
</main>

<div class="sonar" role="dialog" aria-label="声呐终端" aria-modal="true">
  <div class="sonar__box">
    <div class="sonar__bar">
      <i class="sonar__dot sonar__dot--live"></i>
      <i class="sonar__dot"></i>
      <i class="sonar__dot"></i>
      <span>SONAR · ljx@beach</span>
      <button class="sonar__x" type="button">关闭</button>
    </div>
    <div class="sonar__body" role="log" aria-live="polite"></div>
    <label class="sonar__prompt">
      <span class="sonar__sigil">&gt;</span>
      <input class="sonar__input" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="声呐输入">
    </label>
  </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
