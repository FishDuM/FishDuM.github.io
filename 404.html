<!doctype html>
<html lang="zh-CN" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>走错门了 · 会飞的鱼</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2E3CF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F2E3CF'/%3E%3Cpath d='M8 26V14Q8 6 16 6Q24 6 24 14V26Z' fill='%23E35342'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  (function () {
    var r = document.documentElement;
    r.classList.add('js');
    try {
      var t = localStorage.getItem('ljx.theme');
      if (t === 'cream' || t === 'dusk') r.dataset.theme = t;
      if (t === 'dusk') {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = '#1C1814';
      }
    } catch (e) { /* 隐私模式下读不到，用默认配色即可 */ }
  })();
</script>
<style>
  /* 这一页独有的几条，不值得塞进全站样式表 */
  .oops__tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: var(--t--1);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    background: var(--red-deep);
    padding: 0.4em 0.9em;
    border: 2px solid var(--ink);
    border-radius: var(--r-sm);
    box-shadow: 4px 5px 0 0 var(--ink);
    margin-bottom: clamp(1.4rem, 1rem + 1.6vw, 2.2rem);
  }

  .oops__title { font-size: var(--t-3); margin-bottom: 0.7rem; }

  .oops__say {
    font-size: var(--t-1);
    font-weight: 500;
    color: var(--ink-2);
    max-width: 24em;
    margin-bottom: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem);
  }

  .oops__go { display: flex; flex-wrap: wrap; gap: 0.8rem; }

  .oops__go a {
    padding: 0.75em 1.5em;
    font-size: var(--t--1);
    font-weight: 700;
    border: 2px solid var(--ink);
    border-radius: var(--r-sm);
    background: var(--bg-hi);
    box-shadow: 5px 6px 0 0 var(--ink);
    transition: transform 0.35s var(--pop), box-shadow 0.35s var(--pop);
  }

  .oops__go a:first-child { background: var(--red-deep); color: #fff; }

  @media (hover: hover) {
    .oops__go a:hover { transform: translate(-3px, -4px); box-shadow: 9px 11px 0 0 var(--ink); }
  }

  .oops__hint {
    margin-top: clamp(2rem, 1.4rem + 2vw, 3rem);
    font-size: var(--t--1);
    font-weight: 500;
    color: var(--ink-3);
  }

  .oops__hint b { color: var(--red-text); font-weight: 700; }

  /* 手机上唤不出终端，别给一个做不到的提示 */
  @media (hover: none) and (pointer: coarse) { .oops__hint { display: none; } }

  /* 编号避开首页那八张，否则会共用 localStorage 里的存档位置 */
  .s9  { --rot: 7deg;  right: 12%; top: 24%; }
  .s10 { --rot: -6deg; left: 9%;   bottom: 12%; }

  /* 和首页同一条判据：宽度或高度任一不够，就退到首屏底部排开 */
  @media (max-width: 900px), (max-height: 820px) {
    .s9  { --rot: 6deg;  right: 8%; left: auto;  top: auto; bottom: 1.8rem; }
    .s10 { --rot: -7deg; left: 8%;  right: auto; top: auto; bottom: 1.8rem; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav__links">
    <a href="/">回首页</a>
    <button class="nav__toggle" type="button" data-theme-toggle aria-label="切换配色" aria-pressed="false">
      <svg class="i-cream" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.6A8.4 8.4 0 0 1 9.4 3.6a8.4 8.4 0 1 0 11 11Z"/></svg>
      <svg class="i-dusk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
    </button>
  </div>
</nav>

<main>
  <header class="hero">
    <div class="wrap hero__inner">
      <p class="oops__tag">404</p>

      <h1 class="hero__title oops__title">
        <span class="row" data-split aria-label="走错门了">走错门了</span>
      </h1>

      <p class="oops__say">
        这个地址下面什么都没有。可能是我把那一页删了，也可能只是手滑多敲了几个字符。
      </p>

      <p class="oops__go">
        <a href="/">回首页</a>
        <a href="/#things">直接看做过的东西</a>
        <a href="https://github.com/FishDuM" target="_blank" rel="noopener" data-repo="github">去 GitHub</a>
      </p>

      <p class="oops__hint">既然来都来了，这一页也能连续敲 <b>fish</b>，也能按 <b>~</b>。</p>
    </div>

    <div class="hero__mark" aria-hidden="true" data-parallax data-xray="mark">
      <svg viewBox="0 0 440 600" fill="none">
        <path d="M32 586 L32 224 A198 198 0 0 1 428 224 L428 586 Z" fill="var(--ink)"/>
        <path d="M14 566 L14 204 A198 198 0 0 1 410 204 L410 566 Z" fill="var(--red)"
              stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M76 502 L76 208 A136 136 0 0 1 348 208 L348 502 Z" fill="var(--bg-hi)"
              stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <path d="M134 444 L134 212 A78 78 0 0 1 290 212 L290 444 Z" fill="var(--red-deep)"/>
      </svg>
    </div>

    <span class="sticker sticker--yellow s9" data-sticker data-xray="sticker">这里是空的</span>
    <span class="sticker sticker--blue s10" data-sticker>但贴纸还能拖</span>
  </header>
</main>

<div class="term" role="dialog" aria-label="终端" aria-modal="true">
  <div class="term__box">
    <div class="term__bar">
      <i class="term__dot term__dot--live"></i>
      <i class="term__dot"></i>
      <i class="term__dot"></i>
      <span>ljx@home</span>
      <button class="term__x" type="button">关闭</button>
    </div>
    <div class="term__body" role="log" aria-live="polite"></div>
    <label class="term__prompt">
      <span class="term__sigil">&gt;</span>
      <input class="term__input" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="终端输入">
    </label>
  </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
